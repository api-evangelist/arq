aid: arq
name: Arq
description: >-
  Arq (formerly DolarApp) is a Latin American cross-border fintech app that gives travelers,
  investors, and professionals digital dollar and digital euro accounts at real market rates
  without hidden fees. Founded in 2021, the mobile-first platform offers currency conversion,
  a borderless payment card, global accounts to send and receive international payments, bill
  payment, PIX transfers, stock and ETF investing, and high-yield Trade and Save accounts,
  plus ARQ Premium and Prestige tiers. Arq raised $70M from Sequoia Capital and Founders Fund
  and serves over 2 million users across the Americas. Arq is a consumer mobile product and
  does not publish a public API or developer portal; this profile captures its verified public
  identity and web surface for the API Evangelist network.
